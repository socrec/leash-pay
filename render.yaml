services:
  - type: web
    name: leashpay
    runtime: docker
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: VITE_AG_LICENSE_KEY
        sync: false
