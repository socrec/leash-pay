services:
  - type: web
    name: leashpay
    runtime: docker
    # A disk needs a paid plan; without one, every deploy or restart starts with an empty SQLite file.
    plan: starter
    disk:
      name: leashpay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/leashpay.db
      - key: APP_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: VITE_AG_LICENSE_KEY
        sync: false
